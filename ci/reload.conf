# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered

RELOAD_HTTP=""

RELOAD_SERVER="
        location /probe {
            root $WORK/origin;

            iconv_buffer_size 64;
            iconv_filter from=UTF-8 to=ISO-8859-1;
        }"

# Three bytes that only this module can produce here: the file on disk holds
# them as two bytes each in UTF-8.  A reload that left the filter behind
# would still answer 200, with the source bytes -- so the probe asks what
# the module did, not whether the server is up.
RELOAD_EXPECT='ok-ä-ö-ü'

mkdir -p "$WORK/origin/probe"
printf 'ok-\303\244-\303\266-\303\274' > "$WORK/origin/probe/file.txt"

reload_probe() {
	curl -s --max-time 5 "http://127.0.0.1:$PORT/probe/file.txt" |
		iconv -f ISO-8859-1 -t UTF-8
}
